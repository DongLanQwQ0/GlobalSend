name: iPad unsigned IPA

on:
  # Build IPA only after Windows and Android are accepted as stable.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Toolchain
        run: |
          flutter --version
          xcodebuild -version
      - name: Share container regression
        run: |
          mkdir -p artifacts/tmp/ios-share-tests
          swiftc client/ios/Runner/SharedInboxStore.swift client/ios/Tests/SharedInboxGroupTests.swift -o artifacts/tmp/ios-share-tests/SharedInboxGroupTests
          artifacts/tmp/ios-share-tests/SharedInboxGroupTests
      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile
      - name: Build for physical iPad / iPhone
        working-directory: client
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package unsigned IPA
        run: bash scripts/package-ios-unsigned.sh
      - name: Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: GlobalSend-iPad-unsigned-${{ github.run_number }}
          path: artifacts/releases/GlobalSend-iPad-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publish the iPhone / iPad update lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/inspect-ipa-version.py artifacts/releases/GlobalSend-iPad-unsigned.ipa > artifacts/releases/ios-package-version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path('artifacts/releases/ios-package-version.json').read_text())
          Path('artifacts/releases/globalsend-update-ios.json').write_text(json.dumps({
            'schema': 1, 'platform': 'ios', **version,
            'assets': ['GlobalSend-iPad-unsigned.ipa'],
          }))
          PY
          tag=$(python3 -c 'import json; v=json.load(open("artifacts/releases/ios-package-version.json")); print("v"+v["version"]+"-build"+str(v["build"]))')
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "GlobalSend $tag" --notes 'The physical-device IPA requires manual signing.'
          fi
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          commit=$(printf '%s' "$ref" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          kind=$(printf '%s' "$ref" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["type"])')
          if [ "$kind" = tag ]; then commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$commit" --jq '.object.sha'); fi
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo 'This version/build already belongs to another source commit. Bump the build number before publishing.' >&2
            exit 1
          fi
          gh release upload "$tag" artifacts/releases/GlobalSend-iPad-unsigned.ipa artifacts/releases/globalsend-update-ios.json --clobber
      - name: Build summary
        run: |
          {
            echo '## GlobalSend iPad'
            echo 'Download **GlobalSend-iPad-unsigned** from the artifacts below.'
            echo 'This is an **unsigned physical-device IPA**, not a Simulator build.'
            echo 'Extract the artifact ZIP, then sign the IPA with your own tool before installing.'
            echo 'No Apple signing secrets or TestFlight upload are used by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
